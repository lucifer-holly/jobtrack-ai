async function callGLM(apiKey, prompt, systemInstruction = null) {
  if (!apiKey) throw new Error('请先在设置中配置 GLM API Key');
  const url = 'https://open.bigmodel.cn/api/paas/v4/chat/completions';
  const messages = [];
  if (systemInstruction) {
    messages.push({ role: 'system', content: systemInstruction });
  }
  messages.push({ role: 'user', content: prompt });

  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${apiKey}`,
    },
    body: JSON.stringify({
      model: 'glm-4-flash',
      messages,
      temperature: 0.6,
      max_tokens: 2048,
    }),
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`GLM API 错误 (${resp.status}): ${errText.slice(0, 200)}`);
  }
  const data = await resp.json();
  const text = data?.choices?.[0]?.message?.content;
  if (!text) throw new Error('GLM 返回为空,可能触发了安全过滤');
  return text;
}

async function callGemini(apiKey, prompt, systemInstruction = null) {
  if (!apiKey) throw new Error('请先在设置中配置 Gemini API Key');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.6,
      maxOutputTokens: 2048,
    },
  };
  if (systemInstruction) {
    body.systemInstruction = { parts: [{ text: systemInstruction }] };
  }
  const resp = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-goog-api-key': apiKey,
    },
    body: JSON.stringify(body),
  });
  if (!resp.ok) {
    const errText = await resp.text();
    throw new Error(`Gemini API 错误 (${resp.status}): ${errText.slice(0, 200)}`);
  }
  const data = await resp.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
  if (!text) throw new Error('Gemini 返回为空,可能触发了安全过滤');
  return text;
}

// Unified dispatcher
async function callAI(provider, apiKey, prompt, systemInstruction = null) {
  if (provider === 'gemini') {
    return callGemini(apiKey, prompt, systemInstruction);
  }
  // Default to GLM
  return callGLM(apiKey, prompt, systemInstruction);
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr); target.setHours(0,0,0,0);
  return Math.ceil((target - today) / (1000 * 60 * 60 * 24));
}

function formatDate(dateStr, short = false) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  if (short) return `${d.getMonth()+1}.${d.getDate()}`;
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function urgencyLabel(days) {
  if (days === null) return null;
  if (days < 0) return { label: '已过期', color: '#94a3b8' };
  if (days === 0) return { label: '今日截止', color: '#f43f5e', pulse: true };
  if (days <= 3) return { label: `${days}天后截止`, color: '#f43f5e', pulse: true };
  if (days <= 7) return { label: `${days}天后截止`, color: '#f59e0b' };
  if (days <= 14) return { label: `${days}天后截止`, color: '#64748b' };
  return { label: `${days}天后截止`, color: '#94a3b8' };
}

function genId() {
  return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

function Modal({ open, onClose, children, size = 'md', title, subtitle }) {
  useEffect(() => {
    if (!open) return;
    const handler = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', handler);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handler);
      document.body.style.overflow = '';
    };
  }, [open, onClose]);

  if (!open) return null;
  const widths = { sm: 'max-w-md', md: 'max-w-2xl', lg: 'max-w-4xl', xl: 'max-w-6xl' };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" onClick={onClose}>
      <div className="min-h-screen flex items-start justify-center p-4 md:p-8">
        <div className="fixed inset-0 bg-ink-900/30 backdrop-blur-sm fade-in-up"></div>
        <div
          className={`relative bg-ink-50 w-full ${widths[size]} rounded-sm shadow-2xl fade-in-up border border-ink-200`}
          onClick={(e) => e.stopPropagation()}
        >
          {(title || subtitle) && (
            <div className="border-b border-ink-200 px-6 py-5 flex items-start justify-between">
              <div>
                {subtitle && <div className="text-[10px] uppercase tracking-[0.2em] text-accent-orange mb-1 font-mono">{subtitle}</div>}
                {title && <h2 className="font-display text-2xl font-light text-ink-900">{title}</h2>}
              </div>
              <button
                onClick={onClose}
                className="text-ink-400 hover:text-ink-900 transition-colors text-2xl leading-none"
              >×</button>
            </div>
          )}
          <div className="p-6">{children}</div>
        </div>
      </div>
    </div>
  );
}

// ----- KANBAN VIEW -----
function KanbanView({ jobs, onCardClick, onStatusChange, onAIQuickClick }) {
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverCol, setDragOverCol] = useState(null);
  const [filterTrack, setFilterTrack] = useState(null);
  const [filterUrgentOnly, setFilterUrgentOnly] = useState(false);

  // Filter jobs by track + urgency
  const filteredJobs = useMemo(() => {
    return jobs.filter(j => {
      if (filterTrack && j.track !== filterTrack) return false;
      if (filterUrgentOnly) {
        if (j.status === 'offer' || j.status === 'closed') return false;
        const d = daysUntil(j.deadline);
        if (d === null || d < 0 || d > 7) return false;
      }
      return true;
    });
  }, [jobs, filterTrack, filterUrgentOnly]);

  // Count per track (based on total jobs, not filtered)
  const trackCounts = useMemo(() => {
    const counts = { _all: jobs.length };
    Object.keys(TRACKS).forEach(k => { counts[k] = 0; });
    jobs.forEach(j => { if (counts[j.track] !== undefined) counts[j.track]++; });
    return counts;
  }, [jobs]);

  const groupedJobs = useMemo(() => {
    const groups = {};
    STATUSES.forEach(s => { groups[s.id] = []; });
    filteredJobs.forEach(j => {
      if (groups[j.status]) groups[j.status].push(j);
    });
    // Sort by priority + deadline urgency
    const priorityOrder = { high: 0, medium: 1, low: 2 };
    Object.keys(groups).forEach(k => {
      groups[k].sort((a, b) => {
        const pDiff = (priorityOrder[a.priority] || 2) - (priorityOrder[b.priority] || 2);
        if (pDiff !== 0) return pDiff;
        const da = daysUntil(a.deadline) ?? 999;
        const db = daysUntil(b.deadline) ?? 999;
        return da - db;
      });
    });
    return groups;
  }, [filteredJobs]);

  const handleDragStart = (e, jobId) => {
    setDraggedId(jobId);
    e.dataTransfer.effectAllowed = 'move';
  };

  const handleDragOver = (e, statusId) => {
    e.preventDefault();
    setDragOverCol(statusId);
  };

  const handleDrop = (e, statusId) => {
    e.preventDefault();
    if (draggedId) {
      onStatusChange(draggedId, statusId);
    }
    setDraggedId(null);
    setDragOverCol(null);
  };

  const hasFilter = filterTrack || filterUrgentOnly;
  const clearFilters = () => { setFilterTrack(null); setFilterUrgentOnly(false); };

  return (
    <div className="max-w-[1600px] mx-auto px-4 md:px-8 py-6">
      <div className="mb-4">
        <div className="text-[11px] uppercase tracking-[0.25em] text-brand-500 font-mono mb-1 font-semibold">01 — Pipeline Overview</div>
        <h1 className="font-display text-3xl md:text-4xl font-light text-ink-900">
          投递看板 <span className="italic text-ink-400">/ The Board</span>
        </h1>
        <p className="text-sm text-ink-500 mt-1">拖拽卡片改变状态 · 点击查看详情 · 悬浮显示 AI 分析按钮</p>
      </div>

      {/* Filter bar */}
      <div className="mb-5 flex items-center gap-2 flex-wrap">
        <span className="text-xs text-ink-500 font-mono uppercase tracking-wider mr-1">筛选:</span>

        {/* Track filter chips */}
        <FilterChip
          active={filterTrack === null}
          onClick={() => setFilterTrack(null)}
          count={trackCounts._all}
        >全部赛道</FilterChip>
        {Object.entries(TRACKS).map(([id, track]) => (
          <FilterChip
            key={id}
            active={filterTrack === id}
            onClick={() => setFilterTrack(id)}
            color={track.color}
            count={trackCounts[id]}
          >{track.label}</FilterChip>
        ))}

        <div className="w-px h-5 bg-ink-200 mx-1"></div>

        {/* Urgency toggle */}
        <FilterChip
          active={filterUrgentOnly}
          onClick={() => setFilterUrgentOnly(!filterUrgentOnly)}
          color="#f43f5e"
        >⏱ 仅紧急(7天内)</FilterChip>

        {hasFilter && (
          <button
            onClick={clearFilters}
            className="ml-2 text-xs text-ink-500 hover:text-ink-900 underline underline-offset-2"
          >清除筛选</button>
        )}

        <span className="ml-auto text-xs text-ink-500 font-mono">
          显示 <span className="text-ink-900 font-semibold">{filteredJobs.length}</span>
          {hasFilter && <span> / {jobs.length}</span>} 个岗位
        </span>
      </div>

      <div className="overflow-x-auto pb-4 -mx-4 px-4 md:-mx-8 md:px-8">
        <div className="flex gap-4 min-w-max">
          {STATUSES.map(status => {
            const items = groupedJobs[status.id] || [];
            const isDragOver = dragOverCol === status.id;
            return (
              <div
                key={status.id}
                className={`w-[280px] shrink-0 border-2 border-dashed rounded-xl transition-all ${
                  isDragOver ? 'drag-over' : 'border-transparent'
                }`}
                onDragOver={(e) => handleDragOver(e, status.id)}
                onDragLeave={() => setDragOverCol(null)}
                onDrop={(e) => handleDrop(e, status.id)}
              >
                <div className="mb-3 px-1 pt-1 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <span
                      className="w-2 h-2 rounded-full"
                      style={{ background: status.color }}
                    ></span>
                    <span className="text-xs uppercase tracking-wider font-semibold" style={{ color: status.color }}>
                      {status.label}
                    </span>
                  </div>
                  <span className="text-xs font-mono text-ink-400 bg-ink-100 px-1.5 py-0.5 rounded-md">{items.length}</span>
                </div>

                <div className="space-y-2.5 min-h-[60vh]">
                  {items.map((job, idx) => (
                    <KanbanCard
                      key={job.id}
                      job={job}
                      onClick={() => onCardClick(job)}
                      onAIClick={onAIQuickClick}
                      onDragStart={(e) => handleDragStart(e, job.id)}
                      style={{ animationDelay: `${idx * 30}ms` }}
                    />
                  ))}
                  {items.length === 0 && (
                    <div className="border border-dashed border-ink-200 rounded-xl p-4 text-center text-xs text-ink-400">
                      暂无岗位
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function FilterChip({ active, onClick, children, color, count }) {
  return (
    <button
      onClick={onClick}
      className={`text-xs px-3 py-1.5 rounded-full transition-all font-medium border ${

// ----- CALENDAR VIEW -----
function CalendarView({ jobs, onCardClick }) {
  const [cursor, setCursor] = useState(() => {
    const d = new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  });

  const events = useMemo(() => {
    const evts = {};
    const pushEvent = (dateStr, evt) => {
      if (!dateStr) return;
      const key = dateStr.slice(0, 10);
      if (!evts[key]) evts[key] = [];
      evts[key].push(evt);
    };
    jobs.forEach(job => {
      if (job.deadline) {
        pushEvent(job.deadline, { type: 'deadline', job, label: `${job.company} 截止` });
      }
      (job.timeline || []).forEach(t => {
        if (t.type === 'upcoming' || t.type === 'interview' || t.type === 'test') {
          if (t.date >= new Date().toISOString().slice(0,10)) {
            pushEvent(t.date, { type: t.type, job, label: `${job.company} ${t.event}` });
          }
        }
      });
    });
    return evts;
  }, [jobs]);

  const { year, month } = cursor;
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = new Date().toISOString().slice(0, 10);

  const cells = [];
  for (let i = 0; i < startPad; i++) cells.push(null);
  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ date: d, dateStr, events: events[dateStr] || [] });
  }

  const monthLabel = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'][month];

  const prevMonth = () => setCursor(c => c.month === 0 ? { year: c.year-1, month: 11 } : { ...c, month: c.month-1 });
  const nextMonth = () => setCursor(c => c.month === 11 ? { year: c.year+1, month: 0 } : { ...c, month: c.month+1 });
  const goToday = () => { const d = new Date(); setCursor({ year: d.getFullYear(), month: d.getMonth() }); };

  // Upcoming events list
  const upcomingEvents = useMemo(() => {
    const list = [];
    Object.keys(events).sort().forEach(dateStr => {
      if (dateStr >= today) {
        events[dateStr].forEach(e => list.push({ ...e, date: dateStr }));
      }
    });
    return list.slice(0, 10);
  }, [events, today]);

  return (
    <div className="max-w-[1600px] mx-auto px-4 md:px-8 py-6">
      <div className="mb-6 flex items-end justify-between flex-wrap gap-4">
        <div>
          <div className="text-[11px] uppercase tracking-[0.25em] text-accent-orange font-mono mb-1">02 — Timeline</div>
          <h1 className="font-display text-3xl md:text-4xl font-light text-ink-900">
            日历视图 <span className="italic text-ink-400">/ Calendar</span>
          </h1>
        </div>
        <div className="flex items-center gap-2">
          <button onClick={prevMonth} className="w-9 h-9 flex items-center justify-center hover:bg-ink-100 rounded-sm text-ink-600">‹</button>
          <div className="font-display text-xl px-3 min-w-[140px] text-center">
            <span className="font-mono text-sm text-ink-500">{year}</span>
            <span className="mx-2 italic">{monthLabel}</span>
          </div>
          <button onClick={nextMonth} className="w-9 h-9 flex items-center justify-center hover:bg-ink-100 rounded-sm text-ink-600">›</button>
          <button onClick={goToday} className="ml-2 px-3 py-1.5 text-xs border border-ink-300 hover:bg-ink-100 rounded-sm">今天</button>
        </div>
      </div>

      <div className="grid md:grid-cols-[1fr_320px] gap-6">
        {/* Calendar */}
        <div className="bg-ink-50 border border-ink-200 rounded-sm overflow-hidden">
          <div className="grid grid-cols-7 border-b border-ink-200">
            {['日','一','二','三','四','五','六'].map(d => (
              <div key={d} className="py-3 text-center text-xs font-semibold uppercase tracking-wider text-ink-500">
                {d}
              </div>
            ))}
          </div>
          <div className="grid grid-cols-7">
            {cells.map((cell, i) => {
              if (!cell) return <div key={i} className="h-24 md:h-28 border-t border-r border-ink-100 bg-ink-100/30"></div>;
              const isToday = cell.dateStr === today;
              return (
                <div
                  key={i}
                  className={`h-24 md:h-28 border-t border-r border-ink-100 p-1.5 overflow-hidden ${
                    isToday ? 'bg-accent-orange/5' : ''
                  }`}
                >
                  <div className={`text-xs font-mono mb-1 ${
                    isToday ? 'text-accent-orange font-bold' : 'text-ink-600'
                  }`}>
                    {isToday && <span className="inline-block w-1.5 h-1.5 bg-accent-orange rounded-full mr-1 align-middle"></span>}
                    {cell.date}
                  </div>
                  <div className="space-y-0.5">
                    {cell.events.slice(0, 3).map((e, idx) => {
                      const color = e.type === 'deadline' ? '#d9562b' :
                                    e.type === 'interview' || e.type === 'upcoming' ? '#6b3e4e' :
                                    '#918878';
                      return (
                        <button
                          key={idx}
                          onClick={() => onCardClick(e.job)}
                          className="w-full text-left text-[10px] px-1 py-0.5 rounded-sm truncate hover:opacity-80"
                          style={{ background: `${color}15`, color: color }}
                          title={e.label}
                        >
                          {e.label}
                        </button>
                      );
                    })}
                    {cell.events.length > 3 && (
                      <div className="text-[9px] text-ink-400 pl-1">+{cell.events.length - 3} 更多</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Upcoming */}
        <div>
          <div className="text-[11px] uppercase tracking-[0.2em] text-ink-500 font-mono mb-3">
            Upcoming / 待办日程
          </div>
          <div className="space-y-2">
            {upcomingEvents.length === 0 && (
              <div className="text-sm text-ink-400 p-4 border border-dashed border-ink-200 rounded-sm">
                近期没有待办
              </div>
            )}
            {upcomingEvents.map((e, i) => {
              const days = daysUntil(e.date);
              const color = e.type === 'deadline' ? '#d9562b' :
                            e.type === 'interview' || e.type === 'upcoming' ? '#6b3e4e' :
                            '#918878';
              return (
                <button
                  key={i}
                  onClick={() => onCardClick(e.job)}
                  className="w-full text-left bg-ink-50 border border-ink-200 p-3 hover:border-ink-400 transition-colors rounded-sm block"
                >
                  <div className="flex items-start justify-between gap-2 mb-1">
                    <span className="text-[10px] uppercase font-mono tracking-wider" style={{ color }}>
                      {e.type === 'deadline' ? '截止' : e.type === 'interview' ? '面试' : e.type === 'test' ? '笔试' : '待办'}
                    </span>
                    <span className="text-[10px] font-mono text-ink-500">
                      {days === 0 ? '今天' : days === 1 ? '明天' : `${days}天`}
                    </span>
                  </div>
                  <div className="text-sm font-medium text-ink-900 leading-snug">{e.label}</div>
                  <div className="text-[10px] text-ink-500 mt-1 font-mono">{formatDate(e.date)}</div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

// ----- ANALYTICS VIEW -----
function AnalyticsView({ jobs }) {
  const stats = useMemo(() => {
    const total = jobs.length;
    const byStatus = {};
    STATUSES.forEach(s => { byStatus[s.id] = 0; });
    jobs.forEach(j => { byStatus[j.status] = (byStatus[j.status] || 0) + 1; });

    const applied = total - (byStatus.planning || 0);
    const passed = applied - (byStatus.applied || 0);
    const interview = (byStatus.interview || 0) + (byStatus.offer || 0);
    const offer = byStatus.offer || 0;

    // By track
    const byTrack = {};
    Object.keys(TRACKS).forEach(k => { byTrack[k] = 0; });
    jobs.forEach(j => { byTrack[j.track] = (byTrack[j.track] || 0) + 1; });

    // By city
    const byCity = {};
    jobs.forEach(j => { byCity[j.city] = (byCity[j.city] || 0) + 1; });

    // Salary distribution (of offered/interviewed)
    const salaries = jobs
      .filter(j => j.status !== 'planning')
      .map(j => (j.salaryMin + j.salaryMax) / 2);
    const avgSalary = salaries.length ? (salaries.reduce((a,b) => a+b, 0) / salaries.length) : 0;

    return { total, byStatus, applied, passed, interview, offer, byTrack, byCity, avgSalary };
  }, [jobs]);

  const funnelData = [
    { name: '已投递', value: stats.applied, fill: '#4a4439' },
    { name: '通过初筛', value: stats.passed, fill: '#6b3e4e' },
    { name: '进入面试', value: stats.interview, fill: '#d9562b' },
    { name: 'Offer', value: stats.offer, fill: '#5a6b4a' },
  ];

  const trackData = Object.entries(stats.byTrack).map(([k, v]) => ({
    name: TRACKS[k].label,
    value: v,
    color: TRACKS[k].color,
  }));

  const cityData = Object.entries(stats.byCity).map(([city, count]) => ({
    city, count,
  })).sort((a,b) => b.count - a.count);

  const statusData = STATUSES.map(s => ({
    name: s.label,
    count: stats.byStatus[s.id] || 0,
    color: s.color,
  }));

  return (
    <div className="max-w-[1600px] mx-auto px-4 md:px-8 py-6">
      <div className="mb-6">
        <div className="text-[11px] uppercase tracking-[0.25em] text-accent-orange font-mono mb-1">03 — Insights</div>
        <h1 className="font-display text-3xl md:text-4xl font-light text-ink-900">
          数据洞察 <span className="italic text-ink-400">/ Analytics</span>
        </h1>
        <p className="text-sm text-ink-500 mt-1">量化你的求职进度,用数据驱动决策</p>
      </div>

      {/* KPI Row */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <KPICard label="目标岗位总数" value={stats.total} suffix="个" highlight />
        <KPICard label="已投递" value={stats.applied} suffix={`/${stats.total}`} />
        <KPICard label="进入面试" value={stats.interview} suffix="个" />
        <KPICard label="期望月薪均值" value={Math.round(stats.avgSalary)} suffix="K" highlight />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        {/* Funnel */}
        <ChartCard title="投递漏斗" subtitle="Pipeline Conversion">
          <div className="space-y-3 pt-2">
            {funnelData.map((d, i) => {
              const maxVal = Math.max(...funnelData.map(f => f.value));
              const pct = maxVal > 0 ? (d.value / maxVal) * 100 : 0;
              const prevVal = i > 0 ? funnelData[i-1].value : null;
              const conversionRate = prevVal && prevVal > 0 ? Math.round((d.value / prevVal) * 100) : null;
              return (

// ----- Pure SVG Donut Chart -----
function DonutChart({ data, size = 180 }) {
  const total = data.reduce((sum, d) => sum + (d.value || 0), 0);
  if (total === 0) {
    return (
      <div className="text-sm text-ink-400 italic">暂无数据</div>
    );
  }

  const cx = size / 2;
  const cy = size / 2;
  const r = size * 0.42;
  const innerR = size * 0.27;
  const gap = 0.01; // small gap between segments

  let startAngle = -Math.PI / 2;
  const segments = data.filter(d => d.value > 0).map(d => {
    const angle = (d.value / total) * Math.PI * 2 - gap;
    const endAngle = startAngle + angle;

    const x1 = cx + Math.cos(startAngle) * r;
    const y1 = cy + Math.sin(startAngle) * r;
    const x2 = cx + Math.cos(endAngle) * r;
    const y2 = cy + Math.sin(endAngle) * r;

    const ix1 = cx + Math.cos(endAngle) * innerR;
    const iy1 = cy + Math.sin(endAngle) * innerR;
    const ix2 = cx + Math.cos(startAngle) * innerR;
    const iy2 = cy + Math.sin(startAngle) * innerR;

    const largeArc = angle > Math.PI ? 1 : 0;
    const path = `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L ${ix1.toFixed(2)} ${iy1.toFixed(2)} A ${innerR} ${innerR} 0 ${largeArc} 0 ${ix2.toFixed(2)} ${iy2.toFixed(2)} Z`;

    const seg = { ...d, path };
    startAngle = endAngle + gap;
    return seg;
  });

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {segments.map((s, i) => (
        <path key={i} d={s.path} fill={s.color} stroke="#f7f6f2" strokeWidth="2">
          <title>{s.name}: {s.value}</title>
        </path>
      ))}
      <text
        x={cx} y={cy - 6}
        textAnchor="middle"
        className="font-mono"
        style={{ fontSize: '22px', fill: '#1a1815', fontWeight: 300 }}
      >{total}</text>
      <text
        x={cx} y={cy + 12}
        textAnchor="middle"
        style={{ fontSize: '10px', fill: '#918878', letterSpacing: '0.1em' }}
      >TOTAL</text>
    </svg>
  );
}

// ----- Horizontal Bar Chart -----
function HorizontalBarChart({ data, color = '#d9562b' }) {
  const max = Math.max(1, ...data.map(d => d.count));
  return (
    <div className="space-y-2.5">
      {data.map(d => {
        const pct = (d.count / max) * 100;
        return (
          <div key={d.city} className="flex items-center gap-3">
            <div className="w-16 text-xs text-ink-600 shrink-0 text-right">{d.city}</div>
            <div className="flex-1 h-6 bg-ink-100 rounded-sm overflow-hidden relative">
              <div
                className="h-full rounded-sm transition-all duration-700 ease-out"
                style={{ width: `${pct}%`, background: color }}
              ></div>
            </div>
            <div className="w-6 text-xs font-mono text-ink-900 text-right">{d.count}</div>
          </div>
        );
      })}
      {data.length === 0 && <div className="text-sm text-ink-400 italic">暂无数据</div>}
    </div>
  );
}

// ----- Vertical Bar Chart -----
function VerticalBarChart({ data }) {
  const max = Math.max(1, ...data.map(d => d.count));
  return (
    <div className="flex items-end gap-2 pt-4" style={{ minHeight: 200 }}>
      {data.map(d => {
        const pct = (d.count / max) * 100;
        return (
          <div key={d.name} className="flex-1 flex flex-col items-center gap-1.5 min-w-0">
            <div className="text-[10px] font-mono text-ink-600 h-4">{d.count > 0 ? d.count : ''}</div>
            <div className="w-full relative flex items-end" style={{ height: '140px' }}>
              <div
                className="w-full rounded-sm transition-all duration-700 ease-out"
                style={{
                  height: `${Math.max(pct, d.count > 0 ? 3 : 0)}%`,
                  background: d.color,
                  minHeight: d.count > 0 ? '4px' : '0',
                }}
              ></div>
            </div>
            <div className="text-[10px] text-ink-600 text-center truncate w-full" title={d.name}>{d.name}</div>
          </div>
        );
      })}

}

  const activeKey = provider === 'gemini' ? apiKey : glmApiKey;

    if (!jdToParse.trim()) return;

      setParseError(`请先在设置中配置 ${providerCfg.name} API Key`);
      return;

    setParsing(true);
    setParseError('');

      const prompt = `请从以下招聘JD中提取结构化信息,严格以JSON格式返回,不要任何额外解释文字:

{
  "company": "公司名",

JD内容:
${jdToParse}`;

          } />

        </div>
      </div>
    </Modal>
  );
}

function Field({ label, value, onChange, placeholder, type = 'text' }) {
  return (
    <div>
      <label className="text-[10px] uppercase tracking-[0.2em] text-ink-500 font-mono mb-1 block">{label}</label>
      <input
        type={type}
        value={value}
        onChange={e => onChange(e.target.value)}
        placeholder={placeholder}
        className="w-full px-3 py-2 text-sm border border-ink-200 rounded-sm focus:border-accent-orange outline-none"
      />
    </div>
  );
}

function FieldDate({ label, value, onChange }) {
  return <Field label={label} value={value || ''} onChange={onChange} type="date" />;
}

function FieldSelect({ label, value, onChange, options }) {
  return (
    <div>
      <label className="text-[10px] uppercase tracking-[0.2em] text-ink-500 font-mono mb-1 block">{label}</label>
      <select
        value={value}
        onChange={e => onChange(e.target.value)}
        className="w-full px-3 py-2 text-sm border border-ink-200 rounded-sm focus:border-accent-orange outline-none bg-ink-50"
      >
        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
    </div>
  );
}

        <div className="space-y-5">

            <div className="font-display text-2xl mb-2">{selectedProvider.name} 授权</div>
            <div className="text-sm text-ink-500">JobTrack AI 希望访问您的邮箱</div>
          </div>

          <div className="border border-ink-200 rounded-xl p-4 bg-ink-50 space-y-2">
            <div className="text-xs font-semibold text-ink-700 mb-2">此应用将可以:</div>
            {[
              '读取收件箱邮件的主题与正文',
              '识别招聘相关邮件并提取关键信息',
              '不能发送邮件,不能删除邮件',

              <div key={i} className="flex items-start gap-2 text-xs text-ink-600">

          <div className="flex gap-2">

          <div className="max-w-sm mx-auto">

              <div
                className="h-full ai-gradient-btn transition-all duration-300"
                style={{ width: `${syncProgress}%` }}
              ></div>
            </div>
            <div className="text-xs font-mono text-ink-500 mt-2">{syncProgress}% · 已扫描约 {Math.round(syncProgress * 3.2)} 封邮件</div>
          </div>
        </div>
      )}

      {/* Stage 4: Inbox demo */}
      {stage === 'inbox' && (
        <div className="space-y-4">
          {/* Success banner */}
          <div className="flex items-center gap-3 p-3 rounded-xl bg-brand-50 border border-brand-200">

            <div className="flex-1">
              <div className="text-sm font-semibold text-ink-900">已连接 {selectedProvider?.name}</div>

            </div>

            >更换邮箱</button>
          </div>

          {/* Email list */}
          <div className="space-y-2 max-h-[55vh] overflow-y-auto pr-1">
            {fakeEmails.map((e, i) => {
              const typeCfg = typeStyle[e.type] || typeStyle.update;
              return (
                <div
                  key={i}
                  className={`p-3 rounded-xl border transition-all hover:border-brand-400 hover:shadow-sm cursor-pointer ${
                    e.unread ? 'bg-white border-ink-300' : 'bg-ink-50 border-ink-200'
                  }`}
                >
                  <div className="flex items-start gap-2 mb-1">
                    {e.unread && <span className="w-2 h-2 bg-brand-500 rounded-full mt-1.5 shrink-0"></span>}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-0.5">
                        <Badge size="xs" color={typeCfg.color} bg={typeCfg.bg}>{typeCfg.label}</Badge>
                        <span className="text-[10px] font-mono text-ink-500 truncate">{e.from}</span>
                      </div>
                      <div className={`text-sm leading-snug ${e.unread ? 'text-ink-900 font-semibold' : 'text-ink-700'}`}>
                        {e.subject}
                      </div>
                      <div className="flex items-center justify-between mt-1">
                        <div className="text-[10px] text-brand-600 bg-brand-50 px-2 py-0.5 rounded-full inline-block">
                          🔗 关联到:{e.matched}
                        </div>
                        <div className="text-[10px] text-ink-400 font-mono">{e.time}</div>
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="text-[11px] text-ink-500 bg-accent-sunny/10 border border-accent-sunny/30 rounded-lg p-3 flex items-start gap-2">
            <span>🧪</span>
            <span><strong className="text-ink-700">演示数据:</strong>上方为产品完整形态下的效果预览。正式版会在此处显示真实同步的邮件,点击邮件可查看详情,并一键更新对应岗位的状态与时间线。</span>
          </div>

          <div className="flex items-center justify-between pt-2 border-t border-ink-200">
            <div className="text-[10px] text-ink-500">📅 每 15 分钟自动同步一次</div>
            <button
              onClick={onClose}
              className="px-4 py-2 text-sm bg-ink-900 text-white rounded-lg hover:bg-ink-700"
            >完成</button>
          </div>
        </div>
      )}
    </Modal>
  );
}

// ----- AI MODALS -----
function AIModal({ open, onClose, mode, job, apiKey, glmApiKey, provider, onProviderChange, resume, onModeChange }) {
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [retryCount, setRetryCount] = useState(0);

  const config = {
    jd: {
      title: 'JD 智能解析',
      subtitle: 'AI · JD Analysis',
      icon: '◎',
      desc: 'AI将从JD中提取核心要求、技能关键词、加分项',
    },
    match: {
      title: '简历匹配度分析',
      subtitle: 'AI · Match Score',
      icon: '⚖',
      desc: '对比岗位要求和你的简历,生成匹配评分与能力缺口分析',
    },
    interview: {
      title: '面试题预测',
      subtitle: 'AI · Interview Prep',
      icon: '✦',
      desc: '基于岗位特性和公司风格,预测10个高频面试问题',
    },
  };

  const cfg = config[mode] || config.jd;

  const run = async () => {
    if (!apiKey) { setError('请先在设置中配置Gemini API Key'); return; }
    if (!job) return;

    setLoading(true);
    setError('');
    setResult(null);

    let prompt = '';
    let systemInstruction = '';

    if (mode === 'jd') {
      systemInstruction = '你是一位资深HR和招聘专家,擅长从JD中提取结构化的核心信息,输出简洁、专业。';
      prompt = `请从以下招聘JD中提取核心信息,用清晰的结构化markdown格式输出:

## 核心职责
(列出3-5条)

## 硬性要求
(列出候选人必须具备的条件)

## 软性要求/加分项
(列出加分条件)

## 核心技能关键词
(用逗号分隔的标签形式)

## 潜在考察方向
(推测公司最可能考察的能力维度)

---
**岗位**: ${job.company} · ${job.role}
**JD原文**:
${job.jd}`;
    } else if (mode === 'match') {
      if (!resume) { setError('请先在设置中填写简历内容'); setLoading(false); return; }
      systemInstruction = '你是一位资深职业顾问,擅长评估候选人与岗位的匹配度,给出客观、具体、可操作的建议。';
      prompt = `请对比以下候选人简历和岗位JD,给出专业的匹配度分析:

## 综合匹配度评分
(0-100分,并说明评分依据)

## 优势匹配项
(列出候选人与岗位的强匹配点,至少3条)

## 能力缺口
(列出明显的缺口或劣势,并给出弥补建议)

## 投递建议
(是否建议投递、投递策略、简历突出重点、面试准备方向)

---
## 候选人简历:
${resume}

## 岗位JD:
公司: ${job.company}
岗位: ${job.role}
城市: ${job.city}
JD: ${job.jd}`;
    } else if (mode === 'interview') {
      systemInstruction = '你是一位经验丰富的面试官和求职教练,擅长预测特定岗位和公司的面试题目。';
      prompt = `请基于以下岗位信息,预测10个最可能被问到的面试题,并给出回答思路:

## 公司业务理解类 (3题)
1. 问题 + 回答框架
2. ...
3. ...

## 岗位能力考察类 (4题)
4. ...
5. ...
6. ...
7. ...

## 项目/经验深挖类 (2题)
8. ...
9. ...

## 开放性/价值观类 (1题)
10. ...

每个问题简要说明考察意图,并给出2-3句话的回答思路提示。

---
**公司**: ${job.company}
**岗位**: ${job.role}
**赛道**: ${TRACKS[job.track]?.label || ''}
**JD**: ${job.jd}`;
    }

    try {
      const activeKey = provider === 'gemini' ? apiKey : glmApiKey;
      const res = await callAI(provider, activeKey, prompt, systemInstruction);
      setResult(res);
      setRetryCount(0);
    } catch (e) {
      setError(e.message);
      setRetryCount(c => c + 1);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    if (open && job) {
      setResult(null);
      setError('');
      setRetryCount(0);
      run();
    }
  }, [open, job, mode, provider]);

  if (!job) return null;

  // Convert markdown-ish text to HTML
  const renderMarkdown = (md) => {
    if (!md) return '';
    const lines = md.split('\n');
    let html = '';
    let inList = false;
    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('## ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h3>${escapeHtml(trimmed.slice(3))}</h3>`;
      } else if (trimmed.startsWith('# ')) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<h3>${escapeHtml(trimmed.slice(2))}</h3>`;
      } else if (trimmed.match(/^[-*•]\s/)) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += `<li>${parseInline(trimmed.replace(/^[-*•]\s+/, ''))}</li>`;
      } else if (trimmed.match(/^\d+\.\s/)) {
        if (!inList) { html += '<ol>'; inList = true; }
        html += `<li>${parseInline(trimmed.replace(/^\d+\.\s+/, ''))}</li>`;
      } else if (trimmed === '---') {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<hr class="border-ink-200 my-3"/>';
      } else if (trimmed === '') {
        if (inList) { html += '</ul></ol>'; inList = false; }
      } else {
        if (inList) { html += '</ul></ol>'; inList = false; }
        html += `<p>${parseInline(trimmed)}</p>`;
      }
    });
    if (inList) html += '</ul>';
    return html;
  };

  const escapeHtml = (s) => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  const parseInline = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');

  // Friendly error message with retry hint
  const isRateLimit = error && (error.includes('429') || error.includes('rate') || error.includes('quota') || error.includes('limit'));
  const isNetworkErr = error && (error.includes('Failed to fetch') || error.includes('NetworkError') || error.includes('CORS'));
  const tabs = [
    { id: 'jd',        label: 'JD解析',    icon: '◎' },
    { id: 'match',     label: '匹配度',    icon: '⚖' },
    { id: 'interview', label: '面试题',    icon: '✦' },
  ];
  const currentProvider = AI_PROVIDERS[provider] || AI_PROVIDERS.glm;
  const activeKey = provider === 'gemini' ? apiKey : glmApiKey;

  return (
    <Modal open={open} onClose={onClose} size="lg" subtitle={cfg.subtitle} title={cfg.title}>
      <div className="space-y-4">
        {/* Tabs - mode switcher */}
        {onModeChange && (
          <div className="flex items-center gap-1 bg-ink-100 p-1 rounded-lg">
            {tabs.map(t => (
              <button
                key={t.id}
                onClick={() => onModeChange(t.id)}
                className={`flex-1 px-3 py-1.5 text-xs font-medium transition-all rounded-md ${
                  mode === t.id
                    ? 'bg-white text-ink-900 shadow-sm'
                    : 'text-ink-600 hover:text-ink-900'
                }`}
              >
                <span className="mr-1">{t.icon}</span>{t.label}
              </button>
            ))}
          </div>
        )}

        {/* AI Provider Switcher - Dual-Engine */}
        {onProviderChange && (
          <div className="bg-gradient-to-r from-ink-50 to-brand-50/30 border border-ink-200 rounded-lg p-3">
            <div className="flex items-center justify-between mb-2">
              <div className="text-[10px] uppercase tracking-[0.2em] text-ink-500 font-mono font-semibold">
                ⚙ AI 引擎
              </div>
              <div className="text-[10px] text-ink-400">可切换 · 不同模型表现会有差异</div>
            </div>
            <div className="grid grid-cols-2 gap-2">
              {Object.values(AI_PROVIDERS).map(p => {
                const isActive = provider === p.id;
                const keyReady = p.id === 'gemini' ? !!apiKey : !!glmApiKey;
                return (
                  <button
                    key={p.id}
                    onClick={() => onProviderChange(p.id)}
                    className={`relative text-left p-2.5 rounded-lg border-2 transition-all ${
                      isActive
                        ? 'border-brand-500 bg-white shadow-sm'
                        : 'border-ink-200 bg-white/60 hover:border-ink-300'
                    } ${!keyReady ? 'opacity-60' : ''}`}
                  >
                    <div className="flex items-center justify-between mb-1">
                      <div className="flex items-center gap-1.5">
                        <span className="text-base">{p.icon}</span>
                        <span className="text-xs font-semibold text-ink-900">{p.name}</span>
                      </div>
                      {isActive && (
                        <span className="w-4 h-4 bg-brand-500 rounded-full flex items-center justify-center text-white text-[10px]">✓</span>
                      )}
                    </div>
                    <div className="flex items-center gap-1.5 text-[10px]">
                      <span
                        className="px-1.5 py-0.5 rounded-full font-semibold"
                        style={{ background: `${p.badgeColor}20`, color: p.badgeColor }}
                      >{p.badge}</span>
                      <span className="text-ink-500">{p.vendor}</span>
                    </div>
                    {!keyReady && (
                      <div className="text-[9px] text-accent-coral mt-1">⚠ 未配置 Key</div>
                    )}
                  </button>
                );
              })}
            </div>
            {provider === 'gemini' && (
              <div className="mt-2 flex items-start gap-1.5 text-[11px] text-accent-orange bg-accent-orange/10 rounded p-2">
                <span>🌐</span>
                <span>Gemini 需要代理网络环境访问。若在中国大陆直接访问会失败,建议切回 GLM。</span>
              </div>
            )}
          </div>
        )}

        {/* Context */}
        <div className="p-3 bg-gradient-to-r from-brand-50 to-blue-50 rounded-lg text-sm border-l-4 border-brand-500">
          <div className="text-[10px] uppercase tracking-[0.2em] text-brand-600 font-mono mb-1">正在分析</div>
          <div className="font-semibold text-ink-900">{job.company} · {job.role}</div>
          <div className="text-xs text-ink-500 mt-0.5">{cfg.desc}</div>
        </div>

        {/* Helpful reminder (persistent) */}
        {!error && (
          <div className="flex items-start gap-2 p-2.5 bg-accent-sunny/10 border border-accent-sunny/30 rounded-lg text-xs text-ink-700">
            <span className="text-accent-orange mt-0.5">💡</span>
            <span>AI 调用偶尔会因高峰期限流失败。如果返回空或报错,多点几次「重新生成」通常就能成功。</span>
          </div>
        )}

        {/* Body */}
        {loading && (
          <div className="py-12 text-center">
            <div className="inline-block mb-3 text-4xl sparkle-icon">{cfg.icon}</div>
            <div className="text-sm text-ink-600 mb-2">{currentProvider.name} 正在思考...</div>
            <LoadingDots />
            <div className="mt-4 text-xs text-ink-400 max-w-xs mx-auto">
              AI 会仔细分析信息,预计 5-15 秒完成
            </div>
          </div>
        )}

        {error && !loading && (
          <div className="p-4 bg-accent-coral/10 border border-accent-coral/30 text-ink-700 text-sm rounded-lg">
            <div className="flex items-start gap-2 mb-2">
              <span className="text-accent-coral text-lg">⚠</span>
              <div className="flex-1">
                <div className="font-semibold text-accent-coral mb-1">
                  {isNetworkErr && provider === 'gemini'
                    ? 'Gemini 连接失败 (网络限制)'
                    : isRateLimit ? 'API 调用过于频繁' : `${currentProvider.name} 调用失败`}
                </div>
                <div className="text-xs text-ink-600 leading-relaxed">
                  {isNetworkErr && provider === 'gemini'
                    ? '当前网络环境无法访问 Gemini API。建议上方切换到「GLM-4-Flash」(国内稳定),效果同样优秀。'
                    : isRateLimit
                    ? '免费额度有请求频率限制,稍等几秒再重试即可。通常多试 2-3 次就能成功。'
                    : error}
                </div>
                {retryCount > 0 && (
                  <div className="text-[10px] text-ink-500 mt-1 font-mono">已重试 {retryCount} 次</div>
                )}
              </div>
            </div>
            <div className="flex gap-2 mt-2">
              <button
                onClick={run}
                className="px-4 py-2 ai-gradient-btn text-white text-xs font-semibold rounded-md"
              >🔄 再试一次</button>
              {isNetworkErr && provider === 'gemini' && onProviderChange && (
                <button
                  onClick={() => onProviderChange('glm')}
                  className="px-4 py-2 bg-brand-500 text-white text-xs font-semibold rounded-md hover:bg-brand-600"
                >🇨🇳 切换到 GLM</button>
              )}
            </div>
          </div>
        )}

        {result && !loading && (
          <div
            className="ai-prose p-4 bg-white border border-ink-200 rounded-lg max-h-[55vh] overflow-y-auto"
            dangerouslySetInnerHTML={{ __html: renderMarkdown(result) }}
          ></div>
        )}

        {result && !loading && (
          <div className="flex items-center justify-between pt-3 border-t border-ink-200 text-xs text-ink-500">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 bg-brand-500 rounded-full animate-pulse"></span>
              <span>由 {currentProvider.name} ({currentProvider.vendor}) 生成 · 结果仅供参考</span>
            </div>
            <button onClick={run} className="px-3 py-1.5 border border-ink-300 hover:bg-ink-100 rounded-md font-medium">🔄 重新生成</button>
          </div>
        )}
      </div>
    </Modal>
  );
}

// ----- ONBOARDING -----
function Onboarding({ onStart }) {
  return (
    <div className="min-h-screen paper-bg flex items-center justify-center p-4">
      <div className="max-w-2xl w-full bg-white border border-ink-200 p-8 md:p-12 rounded-2xl fade-in-up shadow-xl shadow-brand-500/5">
        <div className="text-[11px] uppercase tracking-[0.3em] text-brand-500 font-mono mb-3 font-semibold">
          ✦ Welcome · 欢迎使用
        </div>
        <h1 className="font-display text-4xl md:text-5xl font-light leading-tight mb-4">
          求职季的 <span className="italic bg-gradient-to-r from-brand-500 to-accent-sky bg-clip-text text-transparent">作战中枢</span>
        </h1>
        <p className="text-ink-600 text-base leading-relaxed mb-6">
          JobTrack AI 是一款为校招求职者打造的<strong className="text-ink-900">AI原生</strong>申请管理工具。
          看板、日历、数据分析一目了然,AI 帮你解析 JD、评估匹配度、预测面试题。
        </p>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-8">
          <FeatureTile icon="⌘" title="智能看板" desc="6列Pipeline 拖拽管理" color="from-brand-500 to-accent-mint" />
          <FeatureTile icon="◫" title="时间线日历" desc="截止与面试 一览无余" color="from-accent-sky to-accent-violet" />
          <FeatureTile icon="✦" title="AI Copilot" desc="JD解析·匹配·面试题" color="from-accent-orange to-accent-coral" />
        </div>
        <button
          onClick={onStart}
          className="w-full py-3.5 ai-gradient-btn text-white text-base font-semibold hover:opacity-90 transition-opacity rounded-xl shadow-lg shadow-brand-500/25"
        >
          进入看板 →
        </button>
        <div className="mt-4 text-center text-xs text-ink-500">
          首次使用 · 已预载 15 个示例岗位 · 所有数据仅存储在本地
        </div>
      </div>
    </div>
  );
}

function FeatureTile({ icon, title, desc, color }) {
  return (
    <div className="p-3 bg-white rounded-xl border border-ink-200 hover:shadow-md transition-shadow">
      <div className={`inline-flex w-9 h-9 items-center justify-center rounded-lg bg-gradient-to-br ${color || 'from-brand-500 to-accent-sky'} text-white text-lg mb-2 shadow-sm`}>
        {icon}
      </div>
      <div className="font-semibold text-sm text-ink-900">{title}</div>
      <div className="text-xs text-ink-500">{desc}</div>

}

// ========================================
// MAIN APP
// ========================================
function App() {
  const [jobs, setJobs] = useState(() => storage.get(STORAGE_KEYS.JOBS, DEMO_JOBS));
  const [apiKey, setApiKey] = useState(() => {
    const stored = storage.get(STORAGE_KEYS.API_KEY, '');
    return stored || (DEMO_CONFIG.GEMINI_API_KEY.startsWith('AIza_在这里') ? '' : DEMO_CONFIG.GEMINI_API_KEY);
  });
  const [glmApiKey, setGlmApiKey] = useState(() => {
    const stored = storage.get(STORAGE_KEYS.GLM_API_KEY, '');
    return stored || (DEMO_CONFIG.GLM_API_KEY.startsWith('在这里') ? '' : DEMO_CONFIG.GLM_API_KEY);
  });
  const [provider, setProvider] = useState(() => storage.get(STORAGE_KEYS.PROVIDER, DEMO_CONFIG.DEFAULT_PROVIDER || 'glm'));
  const [resume, setResume] = useState(() => {
    const stored = storage.get(STORAGE_KEYS.RESUME, '');
    return stored || DEMO_CONFIG.RESUME;
  });
  const [onboarded, setOnboarded] = useState(() => storage.get(STORAGE_KEYS.ONBOARDED, false));

  const [view, setView] = useState('kanban');
  const [selectedJob, setSelectedJob] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [showAIHub, setShowAIHub] = useState(false);
  const [showEmailInbox, setShowEmailInbox] = useState(false);
  const [aiModal, setAIModal] = useState({ open: false, mode: null, job: null });

  // Persist jobs/api/resume
  useEffect(() => { storage.set(STORAGE_KEYS.JOBS, jobs); }, [jobs]);
  useEffect(() => { storage.set(STORAGE_KEYS.API_KEY, apiKey); }, [apiKey]);
  useEffect(() => { storage.set(STORAGE_KEYS.GLM_API_KEY, glmApiKey); }, [glmApiKey]);
  useEffect(() => { storage.set(STORAGE_KEYS.PROVIDER, provider); }, [provider]);
  useEffect(() => { storage.set(STORAGE_KEYS.RESUME, resume); }, [resume]);

  const stats = useMemo(() => {
    const urgent = jobs.filter(j => {
      if (j.status === 'offer' || j.status === 'closed') return false;
      const d = daysUntil(j.deadline);
      return d !== null && d >= 0 && d <= 7;
    }).length;
    return { total: jobs.length, urgent };
  }, [jobs]);

  const handleUpdateJob = (updated) => {
    setJobs(js => js.map(j => j.id === updated.id ? updated : j));
    if (selectedJob?.id === updated.id) setSelectedJob(updated);
  };

  const handleStatusChange = (jobId, newStatus) => {
    setJobs(js => js.map(j => {
      if (j.id !== jobId) return j;
      const updated = { ...j, status: newStatus };
      return updated;
    }));
  };

  const handleAddJob = (newJob) => {
    setJobs(js => [newJob, ...js]);
  };

  const handleDeleteJob = (jobId) => {
    setJobs(js => js.filter(j => j.id !== jobId));
  };

  const handleOpenAI = (mode, job) => {
    setAIModal({ open: true, mode, job });
  };

  // Quick AI from card (defaults to match if resume exists, else jd)
  const handleAIQuickClick = (job) => {
    const mode = resume ? 'match' : 'jd';
    setAIModal({ open: true, mode, job });
  };

  // AI Hub picks both mode and job
  const handleAIHubSelect = (mode, job) => {
    setAIModal({ open: true, mode, job });
  };

  const handleStartOnboarding = () => {
    setOnboarded(true);
    storage.set(STORAGE_KEYS.ONBOARDED, true);
  };

  if (!onboarded) {
    return <Onboarding onStart={handleStartOnboarding} />;
  }

  return (
    <div className="min-h-screen paper-bg">
      <Header
        view={view}
        onViewChange={setView}
        onAdd={() => setShowAdd(true)}
        onSettings={() => setShowSettings(true)}
        onOpenAIHub={() => setShowAIHub(true)}
        onOpenEmail={() => setShowEmailInbox(true)}
        stats={stats}
      />

      <main>
        {view === 'kanban' && (
          <KanbanView
            jobs={jobs}
            onCardClick={setSelectedJob}
            onStatusChange={handleStatusChange}
            onAIQuickClick={handleAIQuickClick}
          />
        )}
        {view === 'calendar' && (
          <CalendarView
            jobs={jobs}
            onCardClick={setSelectedJob}
          />
        )}
        {view === 'analytics' && (
          <AnalyticsView jobs={jobs} />
        )}
      </main>

      <footer className="mt-16 border-t border-ink-200 py-6 text-center text-xs text-ink-500">
        <div className="font-display italic mb-1">JobTrack AI · Crafted for campus recruiters</div>
        <div className="font-mono">v1.0 · Powered by Gemini 2.5 Flash · 所有数据仅存储在本地</div>
      </footer>

      {/* Floating AI Button */}
      <FloatingAIButton onClick={() => setShowAIHub(true)} />

      <JobDetailModal
        job={selectedJob}
        open={!!selectedJob}
        onClose={() => setSelectedJob(null)}
        onUpdate={handleUpdateJob}
        onDelete={handleDeleteJob}
        onOpenAI={handleOpenAI}
      />

      <AddJobModal
        open={showAdd}
        onClose={() => setShowAdd(false)}
        onAdd={handleAddJob}
        apiKey={apiKey}
        glmApiKey={glmApiKey}
        provider={provider}
      />

      <SettingsModal
        open={showSettings}
        onClose={() => setShowSettings(false)}
        apiKey={apiKey}
        onApiKeyChange={setApiKey}
        glmApiKey={glmApiKey}
        onGlmApiKeyChange={setGlmApiKey}
        provider={provider}
        onProviderChange={setProvider}
        resume={resume}
        onResumeChange={setResume}
      />

      <AIHubModal
        open={showAIHub}
        onClose={() => setShowAIHub(false)}
        jobs={jobs}
        onSelectJobAndMode={handleAIHubSelect}
        apiKey={apiKey}
        glmApiKey={glmApiKey}
        provider={provider}
        onProviderChange={setProvider}
        resume={resume}
      />

      <EmailInboxModal
        open={showEmailInbox}
        onClose={() => setShowEmailInbox(false)}
      />

      <AIModal
        open={aiModal.open}
        onClose={() => setAIModal({ open: false, mode: null, job: null })}
        mode={aiModal.mode}
        job={aiModal.job}
        apiKey={apiKey}
        glmApiKey={glmApiKey}
        provider={provider}
        onProviderChange={setProvider}
        resume={resume}
        onModeChange={(newMode) => setAIModal(s => ({ ...s, mode: newMode }))}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
